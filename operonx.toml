# Where the project is, and where its application is declared.
#
# The services and jobs are declared in Python in app/main.py (`APP`), next
# to the graphs they run; this file only points the CLIs at it.
# resources.yaml is the other half: what the project reaches out to
# (models, stores), by key.

[project]
name = "mr-finance"
src  = ["src", "."]     # import roots: the features and `app` import from here
app  = "app.main:APP"

[resources]
overlay = "resources.yaml"

# Which trace sinks every run goes to. "local" records each run under
# .operonx/runs.
[tracing]
sinks = ["local"]

# The page reads are not traced: each recomputes a picture from stored data and changes nothing (the audit log keeps
# what matters), and a trace of one — every step's inputs and outputs, ~0.4 MB for the feed — took two thirds of the
# request's time, its JSON written while the next request waited for the interpreter. The copilot, the agents, the
# jobs and every change stay traced.
[tracing.services.dashboard]
sinks = []
[tracing.services.overview]
sinks = []
[tracing.services.flows]
sinks = []
[tracing.services.feed]
sinks = []
[tracing.services.goals]
sinks = []
[tracing.services.alerts]
sinks = []
[tracing.services.scenario]
sinks = []
[tracing.services.scenario_combine]
sinks = []
[tracing.services.search]
sinks = []

# The Bộ nhớ page (A4–A5): its writes are audited without their text; a trace would copy what a person keeps — a
# memory item, or a document of up to 5 MB — into .operonx/runs in clear.
[tracing.services.assistant_memory]
sinks = []

# The assistant itself (A7): a question and its answer are a person's words, and the ops' inputs hold them — the
# audit log keeps each turn without its text (`assistant.turn`), and the Agent page's map reads that, not traces.
[tracing.services.assistant]
sinks = []
[tracing.services.assistant_stream]
sinks = []
[tracing.services.copilot]
sinks = []
[tracing.services.assistant_conversations]
sinks = []

# The project's stores: what its flows keep, and through which they work together (one flow writes a store, another
# reads it; neither calls the other). All are tables of data/state.db. Ops declare the stores they reach
# (`@op(reads=, writes=)`), and `python scripts/stores.py` holds the declarations equal to the SQL (tests/test_stores.py).
# Tables in no store (sign-in, the audit log, counters, settings, the trial's own records) are every flow's.
[stores.news]
description = "The news inbox: every item fetched, with what the gates and the CIO decided about it."
tables = ["news_items", "news_runs", "reference_stories", "source_runs"]
[stores.events]
description = "Events: news items the CIO grouped into one thing that happened, with its urgent flag."
tables = ["events"]
[stores.agent_queue]
description = "CIO agent runs waiting for the agent_worker job."
tables = ["agent_jobs"]
[stores.views]
description = "House views: what the agents concluded about an event, the challenger's objections, the CIO's decision."
tables = ["agent_runs", "views", "challenges", "decisions", "forecasts"]
[stores.impacts]
description = "A view applied to clients: each family's impact in VND, and the alerts raised for them."
tables = ["application_runs", "family_impacts", "run_snapshots", "client_alerts"]
[stores.results]
description = "Computed results kept for reuse: allocations, impact scores, risk."
tables = ["results"]
[stores.wealth]
description = "What a client declared and holds: profile, holdings, goals."
tables = ["profile", "holdings", "goal_outflows"]
[stores.reviews]
description = "The RM's reviews of a client's allocation."
tables = ["reviews"]
[stores.research]
description = "Research the house released, and where it applies."
tables = ["research_items"]
[stores.policy]
description = "Policy documents the policy agent reads."
tables = ["policy_documents"]
[stores.newsletters]
description = "Newsletters drafted and sent."
tables = ["newsletters"]
[stores.conversations]
description = "The assistant's conversations: turns, attachments, what was parked and what to follow up."
tables = ["conversations", "turns", "parked", "assistant_runs", "attachments", "follow_ups", "consolidations"]
[stores.contacts]
description = "A client's requests to be contacted by their RM."
tables = ["rm_contacts"]
[stores.market]
description = "Market series, and requests to load more."
tables = ["market_series", "load_requests"]
[stores.zone]
description = "What crosses between the bank and the AI zone: packages out, packages in, the sync log."
tables = ["zone_outbox", "zone_syncs", "external_outputs"]
[stores.config]
description = "Versions of the house configuration (sources, rules, catalogues)."
tables = ["config_versions"]

[lint]
baseline = {C13 = 107, C14 = 63, C15 = 48, C16 = 3}
