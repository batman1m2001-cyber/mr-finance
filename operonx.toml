# Where the project is, and where its application is declared.
#
# The services and jobs are declared in Python in app/main.py (`APP`), next
# to the graphs they run; this file only points the CLIs at it.
# resources.yaml is the other half: what the project reaches out to
# (models, stores), by key.

[project]
name = "mr-finance"
src  = ["src", "."]     # import roots: the features and `app` import from here
app  = "app.main:APP"

[resources]
overlay = "resources.yaml"

# Which trace sinks every run goes to. "local" records each run under
# .operonx/runs.
[tracing]
sinks = ["local"]

# The page reads are not traced: each recomputes a picture from stored data and changes nothing (the audit log keeps
# what matters), and a trace of one — every step's inputs and outputs, ~0.4 MB for the feed — took two thirds of the
# request's time, its JSON written while the next request waited for the interpreter. The copilot, the agents, the
# jobs and every change stay traced.
[tracing.services.dashboard]
sinks = []
[tracing.services.overview]
sinks = []
[tracing.services.flows]
sinks = []
[tracing.services.feed]
sinks = []
[tracing.services.goals]
sinks = []
[tracing.services.alerts]
sinks = []
[tracing.services.scenario]
sinks = []
[tracing.services.search]
sinks = []

# The Bộ nhớ page (A4–A5): its writes are audited without their text; a trace would copy what a person keeps — a
# memory item, or a document of up to 5 MB — into .operonx/runs in clear.
[tracing.services.assistant_memory]
sinks = []
