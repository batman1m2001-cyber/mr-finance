[project]
name = "mr-finance"
version = "0.1.0"
description = "An agent with one tool (operonx-agents), served over HTTP."
requires-python = ">=3.10"
dependencies = [
    "operonx[serve,openai]>=1.30.0",
    "operonx-agents>=0.2.3",
    "python-dotenv>=1.0",  # operonx.bootstrap() reads .env with it
    "pypdf>=6.19.0",
    "openpyxl>=3.1.5",
    "cryptography>=43",
]

[project.optional-dependencies]
test = [  # pip: pip install -e ".[test]"
    "pytest>=8",
    "httpx>=0.24",  # starlette's TestClient
]
ui = [  # the browser tests in tests/ui (skipped without it); a Chromium: `playwright install chromium` or MF_CHROMIUM
    "playwright>=1.44",
]

[dependency-groups]
dev = ["mr-finance[test,ui]"]  # uv: `uv sync` installs the test and browser-test extras too

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["ui: browser tests in tests/ui (Playwright + Chromium); skip with -m 'not ui'"]

[tool.ruff]
line-length = 120  # Vietnamese prompts and data rows read better whole
src = ["src", "."]  # the features and `app` are first-party
extend-exclude = [".operonx"]  # generated: the guides `operonx guide` copies in

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_fixtures.py" = ["E501"]  # one client per screen: data rows stay whole
"scripts/make_factors.py" = ["E501"]  # each factor's source line stays whole
"src/impact/_rules.py" = ["E501"]  # the messages a client reads stay whole
"src/explain/metrics.py" = ["E501"]  # the formulas a reader opens stay whole
