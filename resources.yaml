# What this project reaches out to — models, stores, tracing — by key.
# Ops name a key (`LLMOp.of(resource="assistant")`), never build a client.
# Secrets are `${VAR}` here (`${VAR:default}` when optional) and their
# values live in .env; list every name in .env.example.

llm:assistant:
  api_type: openai          # openai | azure | vllm | gemini | anthropic
  # unset: the client still builds, and the AI steps take their rule path (docs/PLAN.md D2)
  api_key: ${LLM_API_KEY:not-set}
  base_url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-4o-mini}

# The CIO agent and the challenger (BRD §8): two different models, so their mistakes do not line
# up. Unset or equal, agent runs are mock (keywords, no model) and say so.
# The news agents (CIO, challenger) have their own endpoint: in the trial, the Claude Code bridge
# (scripts/claude_bridge.py, BUSINESS_FEEDBACK_1021_PLAN B1.0); they never see client data (BR-11).
llm:cio:
  api_type: openai
  api_key: ${LLM_AGENT_API_KEY:not-set}
  base_url: ${LLM_AGENT_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL_CIO:not-set}

llm:challenger:
  api_type: openai
  api_key: ${LLM_AGENT_API_KEY:not-set}
  base_url: ${LLM_AGENT_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL_CHALLENGER:not-set}

# The Copilot's router (redesign kit K5, ADR-0012): sees only the scrubbed question, the page and the tool
# catalogue, and picks a tool. Unset: the keyword router runs instead, labelled as a mock.
llm:copilot:
  api_type: openai
  api_key: ${LLM_API_KEY:not-set}
  base_url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL_COPILOT:not-set}

# The bank's own model for the two client steps (reading a statement, the declaring chat) when the Admins set
# client_ai to onprem (BRD-NFR-08, control/barrier.py): its host must be on client_ai.onprem_hosts, or every call to
# it is refused. Unset (LLM_ONPREM_MODEL), the two steps take their rules in onprem mode.
llm:onprem:
  api_type: openai          # vLLM, TGI, Ollama… anything that speaks the OpenAI chat API
  api_key: ${LLM_ONPREM_API_KEY:not-set}
  base_url: ${LLM_ONPREM_BASE_URL:http://localhost:8000/v1}
  model: ${LLM_ONPREM_MODEL:not-set}
