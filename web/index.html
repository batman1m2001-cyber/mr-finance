<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneWealth</title>
<meta name="description" content="Bức tranh toàn cảnh tài sản của khách hàng, và tin tức đang tác động tới nó.">
<script>try { const t = localStorage.getItem("mf.theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}</script>
<link rel="stylesheet" href="app.css?v=20261016c">
<link rel="stylesheet" href="core/tokens.css?v=20261016c">
</head>
<body>
<header class="shell-top">
  <div class="shell-bar">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true">O</span><span>OneWealth</span></a>
    <div class="roles" role="group" aria-label="Vai trò (demo)" id="roles"></div>
    <label class="pick" id="client-pick">
      <span class="sr">Khách hàng</span>
      <select id="client"></select>
    </label>
    <div class="seg" role="group" aria-label="Phạm vi" id="scope-pick">
      <button type="button" data-scope="personal" aria-pressed="true">Cá nhân</button>
      <button type="button" data-scope="family" aria-pressed="false">Gia đình</button>
    </div>
    <span class="whoami" id="whoami"></span>
    <button type="button" id="theme" class="iconbtn" title="Đổi giao diện sáng / tối" aria-label="Đổi giao diện sáng / tối">◐</button>
  </div>
  <nav class="nav" id="nav" aria-label="Trang"></nav>
</header>
<nav class="subnav" id="subnav" aria-label="Mục" hidden></nav>
<main id="main">
  <section id="page-new" class="page" hidden></section>
  <section id="tab-overview" class="tab" hidden></section>
  <section id="tab-alerts" class="tab" hidden></section>
  <section id="tab-risk" class="tab" hidden></section>
  <section id="tab-scenarios" class="tab" hidden></section>
  <section id="tab-performance" class="tab" hidden></section>
  <section id="tab-perfall" class="tab" hidden></section>
  <section id="tab-sources" class="tab" hidden></section>
  <section id="tab-rm" class="tab" hidden></section>
</main>
<div id="tip" class="tip" role="tooltip" hidden></div>
<footer class="foot">Dữ liệu khách hàng và giá là mô phỏng; tin tức lấy từ nguồn công khai; tham số mô hình là giả định.
  Nội dung không phải khuyến nghị đầu tư. Bộ chuyển vai trò chỉ để demo, không phải cơ chế bảo mật.
  <button type="button" id="reset" class="linkbtn">Làm lại demo</button></footer>
<script src="fmt.js?v=20261016c"></script>
<script src="charts.js?v=20261016c"></script>
<script src="app.js?v=20261016c"></script>
<script type="module" src="shell.js?v=20261016c"></script>
</body>
</html>
