# How this project is built (AGENTS.md: uv run pytest). `operonx-project practices` checks the file.

[tdd]
mode = "acceptance"   # acceptance tests are written before the code, plus held-out tests

# No [architecture]: `operonx-project arch` with the operonx preset (private = "forbid", the layers) reports 52
# violations already in the code (another package's _private names), so the rules are not declared until they are fixed.

[done]
