  { name = "tests", cmd = "uv run pytest -q -p no:cacheprovider --deselect tests/ui/test_pages.py::test_a_statement_and_a_declaration_reach_the_book --deselect tests/ui/test_pages.py::test_the_policy_filter_keeps_one_side" },
]
