# The iPhone app (docs/IOS_APP_PLAN.md): built and tested for the iOS Simulator on a macOS runner, then opened in an
# iPhone simulator once per screen, signed in as the demo client, and photographed light and dark. The run's artifacts:
# the screenshots, the zipped simulator app, and an unsigned iPhone build (OneWealth-unsigned.ipa) that Sideloadly or
# AltStore signs with a free Apple ID to install on a real phone. No signing here, no Apple account.
name: iOS
on:
  push:
    branches: [app/ios]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Project
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild -version

      - name: Simulator
        id: sim
        run: |
          # the newest iOS runtime's first iPhone (Pro preferred): its id for every later step
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if ".iOS-" in k and d[k]), key=lambda k: [int(x) for x in re.findall(r"\d+", k)])
          phones = [x for x in d[ios[-1]] if x["name"].startswith("iPhone")]
          pro = [x for x in phones if re.fullmatch(r"iPhone \d+ Pro", x["name"])]
          print((pro or phones)[0]["udid"])')
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project OneWealth.xcodeproj -scheme OneWealth -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build.log | grep -E "error:|warning: .*OneWealth|Test Case|Executed|BUILD|TEST" || true
          grep -q "TEST SUCCEEDED" build.log

      - name: Screenshots
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Debug-iphonesimulator/OneWealth.app
          ID=app.onewealth.client
          mkdir -p shots
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          shot() {  # shot <name> <seconds> [VAR=value ...]: a fresh launch with those settings, then the screen once loaded
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" "$ID" 2>/dev/null || true
            env "$@" xcrun simctl launch "$UDID" "$ID"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          C=SIMCTL_CHILD_
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            shot "01-signin-$mode" 12 ${C}MF_THEME=$mode ${C}MF_SIGNOUT=1
            shot "02-overview-$mode" 12 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=overview
            shot "03-overview-lower-$mode" 12 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=overview ${C}MF_SCROLL=allocation
            shot "04-overview-risk-$mode" 12 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=overview ${C}MF_SCROLL=risk
            shot "05-assets-$mode" 12 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=assets
            shot "06-cash-$mode" 14 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=cash
            shot "07-cash-month-$mode" 14 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=cash ${C}MF_SCROLL=month
            shot "08-cash-large-$mode" 14 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=cash ${C}MF_SCROLL=large
            shot "09-news-$mode" 14 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=news
            shot "10-news-classes-$mode" 14 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=news ${C}MF_SCROLL=classes
            shot "11-assistant-$mode" 10 ${C}MF_THEME=$mode ${C}MF_DEMO=C01 ${C}MF_SCREEN=assistant
          done
          # one real question to the assistant (one model call a run), light only
          xcrun simctl ui "$UDID" appearance light
          shot "12-assistant-answer-light" 45 ${C}MF_THEME=light ${C}MF_DEMO=C01 ${C}MF_SCREEN=assistant "${C}MF_ASK=Tài sản của tôi thế nào?"
          ls -la shots
          (cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/ios/OneWealth-simulator.zip" OneWealth.app)

      - name: iPhone build (unsigned .ipa)
        run: |
          set -o pipefail
          xcodebuild -project OneWealth.xcodeproj -scheme OneWealth -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee device.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" device.log
          mkdir -p ipa/Payload
          cp -R build-device/Build/Products/Release-iphoneos/OneWealth.app ipa/Payload/
          (cd ipa && zip -qr "$GITHUB_WORKSPACE/ios/OneWealth-unsigned.ipa" Payload)
          ls -la OneWealth-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-ipa
          path: ios/OneWealth-unsigned.ipa
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ios/shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-app
          path: ios/OneWealth-simulator.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore
